[project]
name = "yfinance-mcp-remote"
version = "1.1.0"
description = "Yahoo Finance MCP server — remote HTTP version for Claude iOS, web, and desktop"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "yfinance>=0.2.54",
    "pandas>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "scikit-learn>=1.4.0",
    "ta>=0.11.0",
    "edgartools>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
